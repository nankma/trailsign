[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailsign"
version = "0.1.0"
description = "Resolves a declarative, self-describing config into plain values"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trailsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
