[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trailsign"
version = "0.1.0"
description = "Resolves a declarative, self-describing config into plain values"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nankang Ma", email = "jjkkma@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/nankma/trailsign"
Repository = "https://github.com/nankma/trailsign"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trailsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
